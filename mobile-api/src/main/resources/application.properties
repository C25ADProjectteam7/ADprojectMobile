# ============================================================
# Mobile Platform — Application Configuration
# Secrets injected via env vars in production
# ============================================================

# ---- App ----
spring.application.name=ADprojectMobile
server.port=8080

# ---- MySQL 8.0 ----
# Docker: hostname "mysql" (service name) | Local dev: localhost
spring.datasource.url=jdbc:mysql://mysql:3306/mobile?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=mobile_user
spring.datasource.password=${DB_PASSWORD:Mobile@2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Auto-create tables from JPA entities (change to validate after schema stabilizes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# close OSIV to avoid DB connection leaks
spring.jpa.open-in-view=false

# ---- JWT ----
# Secret must be >= 256 bits; generate with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForDevelopmentAtLeast256Bits!!}
# Token expiration: 24 hours
app.jwt.expiration-ms=86400000

# ---- Agent / ML service ----
# Docker internal: http://agent-ml:8000 | Local dev: http://localhost:8000
app.agent.ml-service.url=${AGENT_ML_URL:http://localhost:8000}

# ---- Amadeus API ----
# Register at https://developers.amadeus.com
app.amadeus.api-key=${AMADEUS_API_KEY:}
app.amadeus.api-secret=${AMADEUS_API_SECRET:}

# ---- Google Places API ----
# Get key at https://console.cloud.google.com
app.google.places.api-key=${GOOGLE_PLACES_API_KEY:}

# ---- File upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.file.upload-dir=/var/www/adproject-mobile/images

# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- Actuator health check ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Logging ----
logging.level.com.team7.mobile=INFO
logging.level.org.springframework.security=WARN
