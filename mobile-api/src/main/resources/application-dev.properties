# ============================================================
# Development profile — activate with: spring.profiles.active=dev
# ============================================================

# Dev: use localhost for MySQL (Docker uses mysql service name)
spring.datasource.url=jdbc:mysql://localhost:3306/mobile?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# auto-sync entities to DB schema (dev only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.team7.mobile=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

debug=true
