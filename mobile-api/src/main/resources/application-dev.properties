# ============================================================
# Development profile — activate with: spring.profiles.active=dev
# ============================================================

# Dev: Docker MySQL mapped to host port 3307 (host 3306 may be occupied by local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/mobile?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# Dev: store uploads in local ./uploads (prod uses /var/www/adproject-mobile/images)
app.file.upload-dir=./uploads

# auto-sync entities to DB schema (dev only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.team7.mobile=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

debug=true
