// mobile-api : REST controllers, Spring Boot entry point, OpenAPI docs
// Depends on: all other modules
// Package: this module contains main() — builds the executable JAR

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':mobile-common')
    implementation project(':mobile-security')
    implementation project(':mobile-data')
    implementation project(':mobile-business')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocOpenApiVersion}"
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

bootJar {
    archiveFileName = 'adproject-mobile-api.jar'
    layered { enabled = true }    // layered JAR = faster Docker image rebuilds
}
