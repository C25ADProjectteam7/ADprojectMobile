# ============================================================
# CI/CD Pipeline — ADprojectMobile
# Triggers: push to main/develop + pull requests
# ============================================================

name: CI/CD Pipeline

permissions:
  contents: read
  security-events: write
  actions: write # required for cache save (otherwise cache is read-only)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # Stage 1: Build
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      # -x spotbugs* : SpotBugs runs only in SAST job (avoid duplicate execution)
      - run: gradle build -x test -x spotbugsMain -x spotbugsTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: mobile-api/build/libs/*.jar

  # ============================================================
  # Stage 2: Unit Tests
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      - run: gradle test --no-daemon
      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit Test Results
          path: "**/build/test-results/test/TEST-*.xml"
          reporter: java-junit

  # ============================================================
  # Stage 2b: Agent-ML Service Build & Test (Python)
  # ============================================================
  agent-ml-test:
    name: Agent-ML Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: agent-ml-service
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: agent-ml-service
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            pip install pytest
            pytest tests/ -v
          else
            echo "No tests found yet in agent-ml-service/tests/ — skipping"
          fi

  # ============================================================
  # Stage 3: SAST
  # ============================================================
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      # Cache OWASP NVD database (skip GB download after first successful save)
      - uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-dc-data-${{ runner.os }}-v1
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      # SpotBugs — Java static analysis
      - run: gradle spotbugsMain spotbugsTest --no-daemon
      # OWASP Dependency Check — CVE scan
      - run: gradle :mobile-api:dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: "**/build/reports/dependency-check-*.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-reports
          path: "**/build/reports/spotbugs/*.html"

  # ============================================================
  # Stage 4: Docker Image Scan
  # ============================================================
  docker:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    needs: [test, sast, agent-ml-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: mobile-api/build/libs/

      # Login to Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Build image, scan with Trivy, then push to Docker Hub
      # Build image (load to local daemon for scanning, do NOT push yet)
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/adproject-mobile-api:latest

      # Trivy — container image CVE scanner (scan BEFORE pushing to registry)
      # NOTE: trivy-action's built-in cache key is HARDCODED to the date
      # (cache-trivy-<date>, see action.yaml v0.36.0) and it ignores any
      # cache-key input — so we disable it and manage the DB cache ourselves
      # with a fixed key to avoid re-downloading the 940MB DB every day.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1
          restore-keys: cache-trivy-data-${{ runner.os }}-

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/adproject-mobile-api:latest
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL"
          exit-code: "0"
          cache: "false"
          cache-dir: .cache/trivy

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/trivy
          key: cache-trivy-data-${{ runner.os }}-v1

      # Push only if build + scan steps succeeded
      - uses: docker/build-push-action@v6.19.2
        if: success()
        with:
          context: .
          file: Dockerfile.ci
          push: true
          load: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/adproject-mobile-api:latest
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ============================================================
  # Stage 4b: DAST — dynamic scan of the built image BEFORE deploy.
  # Boots mysql + spring-api (+ agent-ml) in the runner, runs the
  # OWASP ZAP baseline scan against localhost, uploads the report.
  # deploy waits for this job, so a failing DAST blocks release.
  # ============================================================
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Prepare test .env (dummy secrets, CI-only)
        run: |
          cat > .env <<ENV
          MYSQL_ROOT_PASSWORD=Root@2026!
          MYSQL_PASSWORD=Mobile@2026!
          MYSQL_DATABASE=mobile
          DB_PASSWORD=Mobile@2026!
          # JWT keys are read as UTF-8 bytes (not base64); jjwt requires
          # >= 256 bits, so each dummy must be >= 32 characters
          JWT_SECRET=dummy-jwt-secret-key-for-ci-scan-only-0123456789abcdef
          JWT_TRUSTED_SECRETS=dummy-ci-trusted-secret-0123456789abcdefghijklmno
          AMADEUS_API_KEY=dummy
          AMADEUS_API_SECRET=dummy
          GOOGLE_PLACES_API_KEY=dummy
          DEEPSEEK_API_KEY=dummy
          DUFFEL_API_TOKEN=duffel_test_dummy
          LITEAPI_API_KEY=sand_dummy
          ENV

      - name: Boot the stack (mysql + agent-ml + spring-api)
        run: |
          docker compose up -d mysql spring-api
          docker compose ps

      - name: Wait for the API to come up
        run: |
          for i in $(seq 1 30); do
            curl -s -m 3 -o /dev/null http://localhost:8080/actuator/health && break
            sleep 3
          done
          curl -s -m 5 http://localhost:8080/actuator/health

      - name: Run ZAP baseline scan
        run: |
          # -u root: the ZAP image runs as UID 1000 but the runner workspace
          # is owned by UID 1001 — without it the report write fails with
          # AccessDeniedException on the /zap/wrk mount (CI-only; Windows
          # Docker Desktop masks this with permissive ACLs)
          docker run --rm --network host -u root -v "$PWD:/zap/wrk:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -r zap-report.html -J zap-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: "zap-report.*"

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ============================================================
  # Stage 5: Deploy to Digital Ocean (main branch only)
  # ============================================================
  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: [docker, dast]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} '
            set -e
            cd /home/xiazihang/ADprojectMobile
            git pull origin main
            docker compose pull spring-api
            docker compose build agent-ml
            docker compose up -d
            docker compose ps
            echo "=== DEPLOY COMPLETED ==="
          '

  # ============================================================
  # Stage 6: Smoke Test — functional verification of the live
  # deployment (health, auth, authenticated reads, ML advice).
  # Runs ON the server over SSH (localhost) — the droplet's
  # firewall only allows 8080 from whitelisted IPs, so an
  # external curl from the runner would always fail.
  # A broken deploy fails this job and is visible in the run.
  # ============================================================
  smoke:
    name: Smoke Test (live)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Run smoke tests on the server
        run: |
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "SMOKE_BASE_URL=http://localhost:8080 bash -s" < scripts/smoke-test.sh

  # ============================================================
  # Stage 7: Publish Security Reports to GitHub Pages
  # OWASP + SpotBugs reports auto-deploy to a fixed URL after
  # every main build — no manual downloading needed.
  # ============================================================
  pages:
    name: Publish Security Reports (Pages)
    runs-on: ubuntu-latest
    needs: [sast, dast]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: owasp-dependency-report
          path: reports/owasp
      - uses: actions/download-artifact@v4
        with:
          name: spotbugs-reports
          path: reports/spotbugs
        continue-on-error: true   # spotbugs reports may be absent; OWASP always publishes
      - uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: reports/zap
        continue-on-error: true   # DAST report may be absent; OWASP always publishes
      - name: Build report site
        run: |
          mkdir -p _site
          find reports/owasp -name 'dependency-check*.html' -exec cp {} _site/dependency-check.html \;
          for f in $(find reports/spotbugs -name 'main.html' 2>/dev/null); do
            mod=$(echo "$f" | sed -E 's#.*/([^/]+)/build/reports/spotbugs/main.html#\1#')
            cp "$f" "_site/spotbugs-$mod.html"
          done
          find reports/zap -name 'zap-report.html' -exec cp {} _site/zap-report.html \; 2>/dev/null
          touch _site/.nojekyll
          SB_LI=""
          for f in _site/spotbugs-*.html; do
            [ -e "$f" ] && SB_LI="$SB_LI<li><a href=\"$(basename "$f")\">SpotBugs — $(basename "$f" .html | sed 's/spotbugs-//')</a></li>"
          done
          ZAP_LI=""
          [ -f _site/zap-report.html ] && ZAP_LI='<li><a href="zap-report.html">DAST — OWASP ZAP baseline</a></li>'
          cat > _site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>Security Reports — ADprojectMobile</title>
          <style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#101828}h1{font-size:24px}a{color:#2563eb;text-decoration:none}li{margin:8px 0}</style></head>
          <body>
          <h1>Security Reports — ADprojectMobile</h1>
          <p>Commit <code>${GITHUB_SHA:0:7}</code> · <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">run #${GITHUB_RUN_NUMBER}</a></p>
          <ul>
          <li><a href="dependency-check.html">OWASP Dependency-Check report</a></li>
          ${ZAP_LI}
          ${SB_LI}
          </ul>
          <p>Trivy container-scan alerts: <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/security/code-scanning">Security → Code Scanning</a></p>
          </body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
