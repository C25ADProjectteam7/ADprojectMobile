  # ============================================================
  # Stage 5: Deploy to Digital Ocean
  # ============================================================
  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: mobile-api/build/libs/
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} 'mkdir -p /home/xiazihang/ADprojectMobile/mobile-api/build/libs'
          scp mobile-api/build/libs/adproject-mobile-api.jar \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/xiazihang/ADprojectMobile/mobile-api/build/libs/adproject-mobile-api.jar
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} '
            set -e
            cd /home/xiazihang/ADprojectMobile
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker compose ps
            echo "=== DEPLOY COMPLETED ==="
          '
