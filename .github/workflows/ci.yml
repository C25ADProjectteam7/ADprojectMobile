# ============================================================
# CI/CD Pipeline — ADprojectMobile
# Triggers: push to main/develop + pull requests
# Reference: SA4111 Agile Software Delivery — DevSecOps best practices
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ============================================================
  # Stage 1: Build & Checkstyle
  # ============================================================
  build:
    name: Build & Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      - run: gradle build -x test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: mobile-api/build/libs/*.jar

  # ============================================================
  # Stage 2: Unit Tests (ref: Ch9 Test Automation)
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      - run: gradle test --no-daemon
      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit Test Results
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit

  # ============================================================
  # Stage 3: SAST (ref: Ch7 Pipeline Security, Ch8 SAST)
  # ============================================================
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12

      # Cache NVD database (avoids re-downloading GBs every run)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      # SpotBugs — Java static analysis
      - run: gradle spotbugsMain spotbugsTest --no-daemon

      # OWASP Dependency Check — CVE scan (only api module, includes all transitive deps)
      - run: gradle :mobile-api:dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: '**/build/reports/dependency-check-*.html'

  # ============================================================
  # Stage 4: Docker Build & Image Scan (ref: Ch11 Container Mgmt)
  # ============================================================
  docker:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: adproject-mobile-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy — container image CVE scanner
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: adproject-mobile-api:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # Stage 5: Deploy to Digital Ocean (ref: Ch6 CD, Ch12 Cloud)
  # Only on main branch
  # ============================================================
  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /home/xiazihang/ADprojectMobile
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker compose ps
            echo "=== DEPLOY COMPLETED ==="
