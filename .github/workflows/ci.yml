# ============================================================
# CI/CD Pipeline — ADprojectMobile
# Triggers: push to main/develop + pull requests
# ============================================================

name: CI/CD Pipeline

permissions:
  contents: read
  security-events: write
  actions: write   # required for cache save (otherwise cache is read-only)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ============================================================
  # Stage 1: Build
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      # -x spotbugs* : SpotBugs runs only in SAST job (avoid duplicate execution)
      - run: gradle build -x test -x spotbugsMain -x spotbugsTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: mobile-api/build/libs/*.jar

  # ============================================================
  # Stage 2: Unit Tests
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      - run: gradle test --no-daemon
      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit Test Results
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit

  # ============================================================
  # Stage 3: SAST
  # ============================================================
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # Cache OWASP NVD database (skip GB download after first successful save)
      - uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-dc-data-${{ runner.os }}-v1
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12
      # SpotBugs — Java static analysis
      - run: gradle spotbugsMain spotbugsTest --no-daemon
      # OWASP Dependency Check — CVE scan
      - run: gradle :mobile-api:dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: '**/build/reports/dependency-check-*.html'

  # ============================================================
  # Stage 4: Docker Image Scan
  # ============================================================
  docker:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: mobile-api/build/libs/

      # Login to Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Build image, scan with Trivy, then push to Docker Hub
      # Build image (load to local daemon for scanning, do NOT push yet)
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/adproject-mobile-api:latest

      # Trivy — container image CVE scanner (scan BEFORE pushing to registry)
      # Fixed cache key (default is date-based → re-downloads 940MB DB daily)
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/adproject-mobile-api:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '0'
          cache-key: cache-trivy-${{ runner.os }}-v1

      # Push only if build + scan steps succeeded
      - uses: docker/build-push-action@v6.19.2
        if: success()
        with:
          context: .
          file: Dockerfile.ci
          push: true
          load: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/adproject-mobile-api:latest
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # Stage 5: Deploy to Digital Ocean (main branch only)
  # ============================================================
  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} '
            set -e
            cd /home/xiazihang/ADprojectMobile
            git pull origin main
            docker compose pull spring-api
            docker compose build agent-ml
            docker compose up -d
            docker compose ps
            echo "=== DEPLOY COMPLETED ==="
          '
