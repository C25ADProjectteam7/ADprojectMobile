// Root build — shared plugins, repos, and conventions for all submodules
// Stack: Spring Boot 3.3 + JPA + Spring Security + JWT

plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'com.github.spotbugs' version '6.0.19' apply false          // SAST: static analysis
    id 'org.owasp.dependencycheck' version '12.1.0' apply false     // SAST: CVE scanning
}

allprojects {
    group = 'com.team7.mobile'
    version = '1.0.0-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'org.owasp.dependencycheck'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Dependencies are declared in each module's build.gradle

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }

    // SpotBugs — static analysis
    spotbugs {
        ignoreFailures = true   // tighten when real code is in place
        showStackTraces = true
    }

    // HTML report (build/reports/spotbugs/<sourceSet>.html) — required for
    // the CI artifact upload + GitHub Pages publishing. Note: the reports
    // container lives on the TASK in plugin 6.x, not on the extension.
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html {
                required = true
            }
        }
    }

    // OWASP Dependency Check — CVE scan for third-party libs
    dependencyCheck {
        failBuildOnCVSS = 9.0
        formats = ['HTML', 'JSON']
        suppressionFile = rootProject.file('owasp-suppressions.xml').toString()
        analyzers {
            ossIndex { enabled = false }
            nodeAudit { enabled = false }
            retirejs { enabled = false }
        }
        nvd {
            apiKey = System.getenv('NVD_API_KEY') ?: ''
        }
    }
}
