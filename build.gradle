// Root build — shared plugins, repos, and conventions for all submodules
// Stack: Spring Boot 3.3 + JPA + Spring Security + JWT

plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'com.github.spotbugs' version '6.0.19' apply false          // SAST: static analysis
    id 'org.owasp.dependencycheck' version '10.0.3' apply false     // SAST: CVE scanning
}

allprojects {
    group = 'com.team7.mobile'
    version = '1.0.0-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'org.owasp.dependencycheck'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Shared dependencies — all submodules inherit these automatically
    dependencies {
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
        implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }

    // SpotBugs — static analysis
    spotbugs {
        ignoreFailures = true   // tighten when real code is in place
        showStackTraces = true
    }

    // OWASP Dependency Check — fail on CVSS >= 7.0 (HIGH/CRITICAL)
    dependencyCheck {
        failBuildOnCVSS = 7.0
        formats = ['HTML', 'JSON']
    }
}
