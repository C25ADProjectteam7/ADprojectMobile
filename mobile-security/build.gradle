// mobile-security : JWT token handling, Spring Security filter chain, user auth

plugins {
    id 'java'
    id 'io.spring.dependency-management'
}

repositories { mavenCentral() }

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    implementation project(':mobile-common')
    implementation project(':mobile-data')

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Web (provides jakarta.servlet for JwtAuthFilter)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Spring Data JPA (User entity + UserRepository used by UserDetailsServiceImpl)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    // Test
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
}
