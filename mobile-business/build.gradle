// mobile-business : core services, agent orchestration, Amadeus/Google Places clients

plugins {
    id 'java'
    id 'io.spring.dependency-management'
}

repositories { mavenCentral() }

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    implementation project(':mobile-common')
    implementation project(':mobile-data')
    implementation project(':mobile-security')

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Spring Web + Retry
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'
    // Spring Security (AuthService uses AuthenticationManager + PasswordEncoder)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Data JPA (UserRepository used by AuthService)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Test
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
}
